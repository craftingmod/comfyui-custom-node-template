[project]
name = "comfyui-custom-node-template"
description = "A Bun and Python template for a ComfyUI V3 custom node"
version = "1.0.0"
requires-python = ">=3.12"
readme = "README.md"
license = { file = "LICENSE" }

[project.urls]
Repository = "https://github.com/your-name/your-repo"

[tool.comfy]
PublisherId = "your-username"
DisplayName = "My Custom Node"
Icon = "https://cdn.jsdelivr.net/gh/your-name/your-repo/assets/icon.svg"
includes = ["dist"]

[dependency-groups]
dev = ["pytest>=9.1.1", "ruff>=0.16.3"]
